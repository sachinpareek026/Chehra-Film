<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chehra Films - Loading...</title>
    <script>
      // Single Page Application (SPA) routing fallback for Hostinger & Static Hosts
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Save the intended route to sessionStorage so App.tsx can restore it
        try {
          sessionStorage.setItem('chehra_spa_redirect', path + search + hash);
        } catch (e) {}

        // Immediate redirect to root index with redirect param fallback
        var redirectUrl = '/?redirect=' + encodeURIComponent(path + search + hash);
        window.location.replace(redirectUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #05070B;
        color: #EDE8DF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(234, 179, 8, 0.2);
        border-top-color: #EAB308;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #a1a1aa;">
        Resuming Chehra Films...
      </p>
    </div>
  </body>
</html>
