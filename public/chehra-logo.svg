<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#E5BA53" />
      <stop offset="50%" stop-color="#9E6F1D" />
      <stop offset="75%" stop-color="#F3CF6E" />
      <stop offset="100%" stop-color="#B88628" />
    </linearGradient>

    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#F8D361" />
      <stop offset="70%" stop-color="#DF9F28" />
      <stop offset="100%" stop-color="#FFDE7A" />
    </linearGradient>

    <linearGradient id="night-bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#071936" />
      <stop offset="35%" stop-color="#061226" />
      <stop offset="80%" stop-color="#040B18" />
      <stop offset="100%" stop-color="#02060E" />
    </linearGradient>

    <!-- Glowing effect for neon gold lines -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Metallic Gold Frame -->
  <rect x="6" y="6" width="308" height="468" rx="2" fill="url(#night-bg)" stroke="url(#gold-border)" stroke-width="5" />
  
  <!-- Inner Fine Gold Inset Border -->
  <rect x="12" y="12" width="296" height="456" rx="1" fill="none" stroke="url(#gold-border)" stroke-width="1.2" opacity="0.85" />

  <!-- Starry Background Celestial Dust -->
  <g opacity="0.65">
    <circle cx="50" cy="80" r="1" fill="#FFFFFF" opacity="0.8" />
    <circle cx="85" cy="50" r="0.8" fill="#FCE98A" opacity="0.7" />
    <circle cx="140" cy="65" r="1.2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="210" cy="70" r="0.7" fill="#FCE98A" opacity="0.6" />
    <circle cx="270" cy="110" r="1.1" fill="#FFFFFF" opacity="0.85" />
    <circle cx="75" cy="180" r="0.8" fill="#FCE98A" opacity="0.5" />
    <circle cx="45" cy="260" r="1" fill="#FFFFFF" opacity="0.7" />
    <circle cx="275" cy="240" r="0.8" fill="#FCE98A" opacity="0.6" />
    <circle cx="260" cy="320" r="1.2" fill="#FFFFFF" opacity="0.75" />
    <circle cx="80" cy="340" r="0.9" fill="#FCE98A" opacity="0.65" />
    <circle cx="110" cy="390" r="0.7" fill="#FFFFFF" opacity="0.5" />
    <circle cx="240" cy="380" r="1" fill="#FCE98A" opacity="0.7" />
    <!-- Soft celestial nebular radial spots -->
    <circle cx="160" cy="180" r="70" fill="#153664" opacity="0.3" filter="url(#soft-glow)" />
    <circle cx="130" cy="280" r="60" fill="#0C2344" opacity="0.35" filter="url(#soft-glow)" />
  </g>

  <!-- The One-Line Art Woman Face with Hat Profile (Glowing Continuous Gold Line) -->
  <g filter="url(#gold-glow)">
    <!-- Broad sweeping hat brim top & curve -->
    <path
      d="M 45 138 C 75 142, 95 158, 140 138 C 175 120, 205 85, 235 55 C 248 42, 258 48, 248 68 C 225 105, 185 132, 145 148 C 115 160, 85 155, 68 152"
      fill="none"
      stroke="url(#gold-line)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Face Profile: Forehead, Nose, Lips, Jawline, Ear loop & Cascading Neck -->
    <path
      d="M 98 155
         C 102 178, 105 198, 106 208
         C 107 215, 122 222, 128 223
         C 120 228, 118 235, 122 240
         C 127 241, 140 245, 150 248
         C 142 254, 134 257, 126 260
         C 128 266, 133 273, 140 279
         C 148 285, 172 298, 185 292
         C 215 280, 240 230, 238 185
         C 236 150, 212 145, 204 175
         C 196 202, 205 240, 222 268
         C 192 315, 168 335, 152 380
         C 140 412, 142 425, 148 440"
      fill="none"
      stroke="url(#gold-line)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Gentle Upper/Lower Lip Contour Accent -->
    <path
      d="M 121 240 C 130 242, 145 248, 149 252 C 140 258, 131 259, 126 260"
      fill="none"
      stroke="url(#gold-line)"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Bottom Brand Plaque Box -->
  <g>
    <!-- Plaque Outer Frame Border -->
    <rect x="14" y="415" width="292" height="49" fill="#040A15" stroke="url(#gold-border)" stroke-width="2.5" />
    <rect x="17" y="418" width="286" height="43" fill="none" stroke="url(#gold-border)" stroke-width="0.75" opacity="0.7" />

    <!-- Typography: CHEHRA FILMS in polished serif gold -->
    <text
      x="160"
      y="447"
      font-family="'Cinzel', 'Times New Roman', 'Playfair Display', Georgia, serif"
      font-size="20.5"
      font-weight="700"
      letter-spacing="4.5"
      fill="url(#gold-border)"
      text-anchor="middle"
      style="text-transform: uppercase;"
    >
      CHEHRA FILMS
    </text>
  </g>
</svg>
